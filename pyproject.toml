[project]
name = "appflowy-mcp"
version = "0.1.7"
description = "AppFlowy MCP server for workspace, space, page, database, and row operations"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastmcp>=3.1.1",
    "python-dotenv>=1.2.2",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
appflowy-mcp = "appflowy_mcp.server:main"

[project.urls]
Homepage = "https://github.com/weironz/appflowy_mcp"
Repository = "https://github.com/weironz/appflowy_mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["appflowy_mcp"]
