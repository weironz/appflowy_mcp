name: Release

# One release covers both packages. Bump appflowy-mcp/pyproject.toml (and
# appflowy-cli/pyproject.toml when the CLI changed), commit, then push a tag
# matching the appflowy-mcp version:
#
#   git tag v0.6.4 && git push origin main --tags
#
# The workflow verifies the tag matches appflowy-mcp, runs the tests, builds
# both packages, publishes appflowy-mcp to PyPI (and appflowy-cli too when its
# version is new), and creates a single GitHub Release with all the artifacts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # PyPI Trusted Publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify tag matches appflowy-mcp version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          echo "tag=$tag appflowy-mcp=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match appflowy-mcp version $version"
            exit 1
          fi

      - name: Run tests
        run: uv run --with pytest pytest -q

      - name: Build both packages
        run: |
          uv build -o dist
          (cd appflowy-cli && uv build -o ../dist)

      - name: Publish appflowy-mcp to PyPI
        run: uv publish dist/appflowy_mcp-*

      - name: Publish appflowy-cli to PyPI (only when its version is new)
        run: |
          cli_version="$(cd appflowy-cli && uv version --short)"
          if curl -sf -o /dev/null "https://pypi.org/pypi/appflowy-cli/${cli_version}/json"; then
            echo "appflowy-cli ${cli_version} already on PyPI - skipping publish"
          else
            uv publish dist/appflowy_cli-*
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
