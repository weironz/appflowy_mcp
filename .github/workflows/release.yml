name: Release

# Cut a release:
#   1. bump `version` in appflowy-rs/Cargo.toml
#   2. commit, push main
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# The workflow verifies the tag matches the Rust crate version, runs the test
# suite, builds release binaries for Windows/Linux/macOS, and creates a GitHub
# Release with the binaries attached. PyPI is intentionally NOT published to
# anymore (the Python implementation is deprecated; the crates' final versions
# stay installable as-is).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: appflowy-rs

      - name: Verify tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version' appflowy-rs/Cargo.toml | cut -d '"' -f2)"
          echo "tag=$tag crate=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match appflowy-rs crate version $version"
            exit 1
          fi

      - name: Run tests
        working-directory: appflowy-rs
        run: cargo test --all-targets --locked

      - name: Clippy
        working-directory: appflowy-rs
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: appflowy-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: appflowy-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: appflowy-macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: appflowy-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: appflowy-rs

      - name: Build release binary
        working-directory: appflowy-rs
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          bin="appflowy-rs/target/${{ matrix.target }}/release/appflowy"
          if [ ! -f "$bin" ]; then bin="$bin.exe"; fi
          cp "$bin" "dist/${{ matrix.artifact }}"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: appflowy-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
