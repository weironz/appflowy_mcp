name: Release appflowy-cli

# The CLI is a separate package (appflowy-cli) with its own version line.
# Release it by bumping appflowy-cli/pyproject.toml, committing, then pushing a
# matching "cli-v" tag:
#
#   git tag cli-v0.6.1 && git push origin cli-v0.6.1
#
# Verifies the tag matches the CLI version, builds, publishes to PyPI via
# Trusted Publishing (OIDC), and creates a GitHub Release for the CLI.

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # PyPI Trusted Publishing (OIDC)

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appflowy-cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#cli-v}"
          version="$(uv version --short)"
          echo "tag=$tag package_version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag cli-v$tag does not match appflowy-cli version $version"
            exit 1
          fi

      - name: Smoke import
        run: uv run python -c "import appflowy_cli"

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            appflowy-cli/dist/*.whl
            appflowy-cli/dist/*.tar.gz
          generate_release_notes: true
